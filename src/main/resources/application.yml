server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
spring:
  application:
    name: newsbrief-ai
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: false
app:
  llm:
    active-provider: ${APP_LLM_ACTIVE_PROVIDER:yandex}
  yandex:
    base-url: ${YANDEX_BASE_URL:https://ai.api.cloud.yandex.net/v1}
    api-key: ${YANDEX_API_KEY:}
    iam-token: ${YANDEX_IAM_TOKEN:}
    folder-id: ${YANDEX_FOLDER_ID:}
    model: ${YANDEX_MODEL:yandexgpt-5-lite}
    prompt-id: ${YANDEX_PROMPT_ID:}
    connect-timeout-seconds: ${YANDEX_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${YANDEX_READ_TIMEOUT_SECONDS:45}
resilience4j:
  retry:
    instances:
      yandexAgent:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      yandexAgent:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: newsbrief-ai
info:
  app:
    name: NewsBrief AI
    variant: "13"
    description: "Сервис генерации кратких аннотаций новостных статей"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
